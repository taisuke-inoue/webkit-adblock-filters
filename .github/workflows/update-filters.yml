name: Build WebKit Filters

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download 5 Filters and Convert to WebKit JSON
        run: |
          mkdir -p dist
          rm -f combined_filter.txt

          # 採用した5本のフィルタID (ベース, モバイル広告, 日本語, 追跡防止, アプリバナー)
          FILTER_IDS=(2 11 7 3 20)

          echo "1. 5本のフィルタをダウンロードして結合中..."
          for id in "${FILTER_IDS[@]}"; do
            url="https://filters.adtidy.org/ios/filters/${id}_optimized.txt"
            echo "Fetching Filter ID: ${id} (${url})"
            curl -sS -L "$url" >> combined_filter.txt
            echo "" >> combined_filter.txt
          done

          echo "結合後の総行数: $(wc -l < combined_filter.txt) 行"

          echo "2. AdGuard公式 SafariConverterLib CLI のビルド..."
          git clone --depth 1 https://github.com/AdguardTeam/SafariConverterLib.git
          cd SafariConverterLib
          swift build -c release --product ConverterTool

          echo "3. ConverterToolのヘルプ確認とWebKit用JSONへの変換..."
          # ログ確認用に一度ヘルプを表示
          .build/release/ConverterTool --help || true

          # ConverterToolは標準入力(<)からルールを受け取り、標準出力(>)へ出力する仕様
          .build/release/ConverterTool --safari-version 16.4 --optimize true < ../combined_filter.txt > ../dist/rules_raw.json

          cd ..

          echo "4. WKContentRuleList用のJSON配列を抽出..."
          # 出力されたJSONの形式に合わせて配列部分だけを抽出
          if jq -e 'type == "array"' dist/rules_raw.json > /dev/null 2>&1; then
            jq -c '.' dist/rules_raw.json > dist/rules.json
            rm dist/rules_raw.json
          elif jq -e '.converted' dist/rules_raw.json > /dev/null 2>&1; then
            jq -c '.converted | fromjson' dist/rules_raw.json > dist/rules.json
            rm dist/rules_raw.json
          elif jq -e '.safariRulesJSON' dist/rules_raw.json > /dev/null 2>&1; then
            jq -c '.safariRulesJSON | fromjson' dist/rules_raw.json > dist/rules.json
            rm dist/rules_raw.json
          elif jq -e '.json' dist/rules_raw.json > /dev/null 2>&1; then
            jq -c '.json | fromjson' dist/rules_raw.json > dist/rules.json
            rm dist/rules_raw.json
          else
            echo "出力構造の確認:"
            head -c 500 dist/rules_raw.json
            mv dist/rules_raw.json dist/rules.json
          fi

          # 変換後のルール数をログに出力（WebKit上限15万ルールの確認用）
          RULE_COUNT=$(jq 'length' dist/rules.json)
          echo "=========================================="
          echo "変換完了！ 総ルール数: ${RULE_COUNT} / 150,000"
          echo "=========================================="

          cp LICENSE dist/LICENSE.txt 2>/dev/null || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > dist/version.txt

          ls -lh dist/

      - name: Upload Artifact for testing
        uses: actions/upload-artifact@v4
        with:
          name: webkit-filter-dist
          path: dist/
          retention-days: 5
